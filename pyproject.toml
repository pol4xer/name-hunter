[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "name-hunter"
version = "0.1.0"
description = "Проверка доступности Telegram username"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Telethon==1.45.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["name_hunter*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
